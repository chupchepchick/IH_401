spring.application.name=reactive
spring.config.import=optional:file:secret.properties

spring.r2dbc.url=r2dbc:postgresql://localhost:5432/reactive_store
spring.r2dbc.username=postgres
spring.r2dbc.password=${db.password}

spring.flyway.url=jdbc:postgresql://localhost:5432/reactive_store
spring.flyway.user=postgres
spring.flyway.password=${db.password}
spring.flyway.enabled=true